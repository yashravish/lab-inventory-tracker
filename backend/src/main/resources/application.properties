spring.application.name=lab-inventory

# Optional .env at the working directory — Spring Boot treats it as a properties file.
# (Also loaded earlier by DotenvEnvironmentPostProcessor for legacy callers; this line
# documents the supported override location.)
spring.config.import=optional:file:./.env[.properties]

# Seeded user (override via env vars or .env). One row in app_users at startup.
app.seed.username=${APP_SEED_USERNAME:yash.s}
app.seed.password=${APP_SEED_PASSWORD:labtech}
app.seed.display-name=${APP_SEED_DISPLAY_NAME:Lab Tech}

# PostgreSQL (override via env for docker-compose or your local instance).
# On Railway, set DATABASE_URL (postgresql://user:pass@host:port/db) — the
# DatabaseUrlEnvironmentPostProcessor parses it into the spring.datasource.* values
# below, so you don't have to set SPRING_DATASOURCE_* manually.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5434/labinventory}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:labinventory}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:labinventory}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Railway injects PORT. Fall back to SERVER_PORT, then 8082 for local dev.
server.port=${PORT:${SERVER_PORT:8082}}

# Comma-separated list. In production set APP_CORS_ALLOWED_ORIGINS to the frontend
# public origin (exact scheme + host, no path, no trailing slash).
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:5175,http://localhost:3000}

anthropic.api-key=${ANTHROPIC_API_KEY:}
anthropic.model=claude-haiku-4-5-20251001
ai.mock=${MOCK_AI:false}
